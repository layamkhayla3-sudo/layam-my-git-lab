<!DOCTYPE html>
<html>
<head>
    <title>Simple Clock</title>
    <style>
        body {
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f2f2f2;
        }
        h1 {
            font-size: 60px;
        }
    </style>
</head>
<body>
    <h1 id="clock"></h1>

    <script>
        setInterval(() => {
            document.getElementById('clock').innerHTML =
                new Date().toLocaleTimeString();
        }, 1000);
    </script>
</body>
</html>
